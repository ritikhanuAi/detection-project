<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}RoadAthena AI{% endblock %}</title>
  
  <!-- Inter Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- CSS Token System & Modular Components -->
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/css/pages.css">
  {% block extra_css %}{% endblock %}
</head>
<body>
  <!-- Minimalist Header & Navigation -->
  <header class="app-header">
    <div class="nav-container">
      <a href="/" class="brand-wrap">
        <span style="font-size: 1.4rem;">🛣️</span>
        <span class="brand-logo">RoadAthena AI</span>
      </a>
      <nav class="nav-links">
        <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}">Dashboard</a>
        <a href="/stage1/" class="nav-link {% if '/stage1' in request.path %}active{% endif %}">Stage 1: Road Profiler</a>
        <a href="/stage2/" class="nav-link {% if '/stage2' in request.path %}active{% endif %}">Stage 2: Detection Validator</a>
      </nav>
      <div style="display: flex; align-items: center; gap: 8px;">
        <span class="badge badge-neutral" style="font-family: var(--font-mono); font-size: 0.75rem;">
          CPU: Qwen2.5-VL / Gemini
        </span>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="app-container">
    {% block content %}{% endblock %}
  </main>

  <!-- Modular Scripts -->
  {% block extra_js %}{% endblock %}
</body>
</html>
