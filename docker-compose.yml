version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: roadathena_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: roadathena
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d roadathena"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: roadathena_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: roadathena_web
    restart: unless-stopped
    command: gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 3 --threads 2 --timeout 180
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=roadathena-dev-docker-secret-2026
      - ALLOWED_HOSTS=*
      - DATABASE_URL=postgres://postgres:postgrespassword@db:5432/roadathena
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - CELERY_WORKER_CONCURRENCY=2
      - AI_PROVIDER=ollama
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=gemini-1.5-flash
      - OLLAMA_BASE_URL=http://ollama:11434
      - VLM_MODEL=qwen2.5vl:3b
      - VLM_FALLBACK_MODEL=moondream:latest
      - VLM_TIMEOUT_SECONDS=120
      - VLM_MAX_IMAGE_WIDTH=768
      - STAGE1_SAMPLE_FRAMES=8
      - STAGE1_LAPLACIAN_BLUR_THRESHOLD=100.0
      - STAGE2_BBOX_PADDING_RATIO=0.15
      - STAGE2_CONCURRENT_DETECTIONS=2
      - MAX_UPLOAD_SIZE_MB=500
    volumes:
      - .:/app
      - media_data:/app/media
      - static_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: roadathena_worker
    restart: unless-stopped
    command: celery -A core worker -l info --concurrency=2
    environment:
      - DEBUG=True
      - SECRET_KEY=roadathena-dev-docker-secret-2026
      - DATABASE_URL=postgres://postgres:postgrespassword@db:5432/roadathena
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - CELERY_WORKER_CONCURRENCY=2
      - AI_PROVIDER=ollama
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=gemini-1.5-flash
      - OLLAMA_BASE_URL=http://ollama:11434
      - VLM_MODEL=qwen2.5vl:3b
      - VLM_FALLBACK_MODEL=moondream:latest
      - VLM_TIMEOUT_SECONDS=120
      - VLM_MAX_IMAGE_WIDTH=768
      - STAGE1_SAMPLE_FRAMES=8
      - STAGE1_LAPLACIAN_BLUR_THRESHOLD=100.0
      - STAGE2_BBOX_PADDING_RATIO=0.15
      - STAGE2_CONCURRENT_DETECTIONS=2
    volumes:
      - .:/app
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started

  ollama:
    image: ollama/ollama:latest
    container_name: roadathena_ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11435}:11434"
    volumes:
      - /usr/share/ollama/.ollama:/root/.ollama

volumes:
  postgres_data:
  redis_data:
  media_data:
  static_data:
